services:
  postgres:
    image: postgres:16
    container_name: carburants_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carburants}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carburants}
      POSTGRES_DB: ${POSTGRES_DB:-carburants}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carburants}"]
      interval: 5s
      retries: 10

  # Interface web pour explorer la base : http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4
    container_name: carburants_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data: